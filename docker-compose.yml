services:
  postgres:
    image: postgres:17-alpine
    container_name: gym-management-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gym_management
      POSTGRES_USER: gym_admin
      POSTGRES_PASSWORD: gym_local_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gym_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_admin -d gym_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gym_postgres_data:

